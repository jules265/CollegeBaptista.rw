<body>

    <main class="container">
        <!-- Embed Jitsi Meet -->
        <h3 style="text-align: center; color: var(--primary-color); font-size: 25px;">Live Meeting</h3>
        <iframe src="https://meet.jit.si/BaptisteGacuba2-Math-Meeting"
                allow="microphone; camera; fullscreen; display-capture; encrypted-media; autoplay"
                loading="lazy"></iframe>
    </main>
    <section>
    <!-- Countdown Timer -->
    <h2>Next Meeting Starts In:</h2>
    <div class="lod"></div>
<div id="countdown"></div>
<footer>
    <p>&copy; 2024 School Website. All rights reserved.</p>
</footer>
</section>
    
    <script>
        var countDownDate = new Date("March 1, 2025 10:00:00").getTime();
        var x = setInterval(function() {
            var now = new Date().getTime();
            var distance = countDownDate - now;
    
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
            document.getElementById("countdown").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";
    
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").innerHTML = "Meeting Started!";
                alert("THE MEETTING IS STARTING");
            }
        }, 1000);
    </script>
</body>
